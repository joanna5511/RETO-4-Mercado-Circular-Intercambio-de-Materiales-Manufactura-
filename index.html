<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema Multipágina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card bg-secondary bg-opacity-25 text-light border-info shadow">
                    <div class="card-header bg-dark text-info text-center py-3">
                        <h4 class="mb-0">Control de Acceso</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-dark border-info small text-center">
                            Administrador de Red (adminred) <br>  Fabrica de Miembro (fabricamiembro) <br> Fabrica de Miembro 2 (fabricamiembro2)<br>Clave para todos: <strong>123</strong>
                        </div>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-info">Usuario</label>
                                <input type="text" id="inputUser" class="form-control bg-dark text-light border-secondary" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-info">Contraseña</label>
                                <input type="password" id="inputPass" class="form-control bg-dark text-light border-secondary" required>
                            </div>
                            <button type="submit" class="btn btn-info w-100 fw-bold">Ingresar</button>
                            <div id="errorMsg" class="text-danger mt-3 text-center d-none">Credenciales inválidas.</div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./JS/miScrip.js"></script>
    <script>
        // Si el usuario ya está logueado, lo sacamos del login
        document.addEventListener('DOMContentLoaded', saltarLoginSiAutenticado);
        
        // Conectar el formulario a la función de JS
        document.getElementById('formLogin').addEventListener('submit', iniciarSesion);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Red</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

    <nav class="navbar navbar-dark bg-dark border-bottom border-danger py-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-danger fs-5">MERCADO DE ALGODONES BONITOS</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small">Sesión de: <strong id="infoUsuario" class="text-danger"></strong></span>
                <button type="button" class="btn btn-sm btn-outline-danger fw-bold" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="mb-4">
            <h1 class="h3 fw-bold text-danger mb-1">Administrador de Red</h1>
            <p class="text-secondary small mb-0">Gestiona todos los anuncios publicados por las fábricas: aprueba o rechaza solicitudes y ofertas.</p>
        </div>

        <div class="card bg-dark text-light border border-danger shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold text-danger mb-0">Gestión Global de Anuncios</h2>
                    <span class="badge bg-danger text-light fw-bold">TODOS LOS ANUNCIOS</span>
                </div>

                <div id="contenedorAnunciosAdmin" class="d-flex flex-column gap-3">
                    <!-- Aquí se renderizan todos los anuncios con botones para Aprobar o Rechazar desde JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="./JS/miScrip.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => verificarAcceso('Administrador'));
    </script>
</body>
</html>
